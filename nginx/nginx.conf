# This configuration is for the Nginx 'stream' module (TCP/UDP proxying)
events {}
stream {
    # Match the QA's TLS 1.2 and cipher requirements
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-RSA-CHACHA20-POLY1305;

    # Nginx listens on the public-facing port 8883
    listen 8883 ssl;

    # Nginx uses your broker certs (paths relative to its container volume mount)
    ssl_certificate /etc/nginx/certs/broker.crt;
    ssl_certificate_key /etc/nginx/certs/broker.key;

    # Nginx enforces Client Certificate Auth (mTLS) using the CA (DigiCert)
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on; 
    
    # Forward the decrypted traffic to the internal Mosquitto service
    proxy_pass mosquitto:1883; 
}